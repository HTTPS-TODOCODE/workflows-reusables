name: Docker Setup
description: >
  Logs in to Docker Hub and configures Buildx.
  Centralizes repeated setup steps so every job
  stays DRY.

inputs:
  dockerhub-username:
    description: Docker Hub username (vars.DOCKERHUB_USERNAME)
    required: true
  dockerhub-token:
    description: Docker Hub access token (secrets.DOCKERHUB_TOKEN)
    required: true

runs:
  using: composite
  steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
