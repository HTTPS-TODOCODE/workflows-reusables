name: Run the SonarQube Analysis for Maven Projects
author: kadanarpaOps
description: Receive a the Project to be validated through SonarQube and the necessary credentials to run the analysis

inputs:
  project-name:
    description: 'Name of the Project in the SonarQube Panel'
    required: true
  sonar-url:
    description: 'SonarQube Base URL to Fetch'
    required: true
  sonar-token:
    description: 'Sonar Permissions Token'
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run the Sonar Validation Analysis
      shell: bash
      run: |
        mvn clean verify sonar:sonar \
          "-Dsonar.projectKey=${{ inputs.project-name }}" \
          "-Dsonar.projectName='${{ inputs.project-name }}'" \
          "-Dsonar.host.url=${{ inputs.sonar-url }}" \
          "-Dsonar.token=${{ inputs.sonar-token }}" \
          "-Dsonar.qualitygate.wait=true"
      